apiVersion: basable.com/v1
kind: ProjectPlan
project:
  language: rust
  frontend: static
  auth: kratos
  database: { instances: 1 }
nanoservices:
  - name: site
    description: Owns websites, members and roles, navigation, custom domains, and the theme catalog.
    owns:
      processingObjects:
        - name: domain
          prefix: dom
          spec:
            - { name: site_id, type: uuid, immutable: true }
            - { name: hostname, type: string, immutable: true }
            - { name: verification_token, type: string, immutable: true }
          status:
            - { name: phase, type: string }
            - { name: verified_at, type: timestamp, nullable: true }
            - { name: last_checked_at, type: timestamp, nullable: true }
            - { name: consecutive_misses, type: int32 }
            - { name: last_error, type: string, nullable: true }
      tables:
        - name: site
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: slug, type: string, unique: true }
            - { name: name, type: string }
            - { name: theme_name, type: string }
            - { name: created_at, type: timestamp }
        - name: site_member
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: site_id, type: uuid }
            - { name: identity_id, type: uuid }
            - { name: role, type: string }
            - { name: created_at, type: timestamp }
          indexes: [ { columns: [site_id, identity_id] }, { columns: [identity_id] } ]
        - name: nav_item
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: site_id, type: uuid }
            - { name: label, type: string }
            - { name: page_path, type: string }
            - { name: position, type: int32 }
          indexes: [ { columns: [site_id, position] } ]
      configTypes:
        - name: theme
          prefix: thm
          fields:
            - { name: layout_html, type: string }
            - { name: css, type: string }
    handles:
      - { message: CreateSiteRequest, response: Site }
      - { message: UpdateSiteRequest, response: Site }
      - { message: GetSiteRequest, response: Site }
      - { message: ListSitesRequest, response: SiteList }
      - { message: AddSiteMemberRequest, response: SiteMember }
      - { message: RemoveSiteMemberRequest, response: SiteMember }
      - { message: ListSiteMembersRequest, response: SiteMemberList }
      - { message: SaveNavigationRequest, response: Navigation }
      - { message: AddDomainRequest, response: Domain }
      - { message: RemoveDomainRequest, response: Domain }
      - { message: ListDomainsRequest, response: DomainList }
      - { message: VerifyDomainRequest, response: Domain }
      - { message: AuthorizeSiteAccessRequest, response: SiteAccess }
      - { message: ResolvePublicSiteRequest, response: PublicSite }
    api:
      service: SiteService
      methods:
        - { name: CreateSite, request: CreateSiteRequest, response: CreateSiteResponse }
        - { name: UpdateSite, request: UpdateSiteRequest, response: UpdateSiteResponse }
        - { name: GetSite, request: GetSiteRequest, response: GetSiteResponse }
        - { name: ListSites, request: ListSitesRequest, response: ListSitesResponse }
        - { name: AddSiteMember, request: AddSiteMemberRequest, response: AddSiteMemberResponse }
        - { name: RemoveSiteMember, request: RemoveSiteMemberRequest, response: RemoveSiteMemberResponse }
        - { name: ListSiteMembers, request: ListSiteMembersRequest, response: ListSiteMembersResponse }
        - { name: SaveNavigation, request: SaveNavigationRequest, response: SaveNavigationResponse }
        - { name: AddDomain, request: AddDomainRequest, response: AddDomainResponse }
        - { name: RemoveDomain, request: RemoveDomainRequest, response: RemoveDomainResponse }
        - { name: ListDomains, request: ListDomainsRequest, response: ListDomainsResponse }
        - { name: VerifyDomain, request: VerifyDomainRequest, response: VerifyDomainResponse }

  - name: content
    description: Owns pages and posts, the page tree, revisions, the live pointer, and scheduled publications.
    owns:
      processingObjects:
        - name: publication
          prefix: pub
          spec:
            - { name: page_id, type: uuid, immutable: true }
            - { name: action, type: string, immutable: true }
            - { name: revision_id, type: uuid, immutable: true, nullable: true }
            - { name: publish_at, type: timestamp }
          status:
            - { name: phase, type: string }
            - { name: applied_at, type: timestamp, nullable: true }
      tables:
        - name: page
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: site_id, type: uuid }
            - { name: kind, type: string }
            - { name: parent_id, type: uuid, nullable: true }
            - { name: slug, type: string }
            - { name: path, type: string }
            - { name: depth, type: int32 }
            - { name: created_at, type: timestamp }
            - { name: updated_at, type: timestamp }
          indexes: [ { columns: [site_id, path] }, { columns: [site_id, kind] }, { columns: [parent_id] } ]
        - name: page_revision
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: page_id, type: uuid }
            - { name: title, type: string }
            - { name: body, type: json }
            - { name: meta_description, type: string, nullable: true }
            - { name: social_image_url, type: string, nullable: true }
            - { name: post_date, type: timestamp, nullable: true }
            - { name: tags, type: json }
            - { name: author_id, type: uuid }
            - { name: created_at, type: timestamp }
          indexes: [ { columns: [page_id, created_at] } ]
        - name: published_page
          columns:
            - { name: page_id, type: uuid, primaryKey: true }
            - { name: revision_id, type: uuid, nullable: true }
            - { name: set_at, type: timestamp }
            - { name: set_by_publication_id, type: uuid, nullable: true }
            - { name: first_published_at, type: timestamp, nullable: true }
    handles:
      - { message: CreatePageRequest, response: Page }
      - { message: SavePageRequest, response: Page }
      - { message: MovePageRequest, response: Page }
      - { message: GetPageRequest, response: Page }
      - { message: ListPagesRequest, response: PageList }
      - { message: ListRevisionsRequest, response: RevisionList }
      - { message: PublishPageRequest, response: Page }
      - { message: UnpublishPageRequest, response: Page }
      - { message: SchedulePublicationRequest, response: Publication }
      - { message: ReschedulePublicationRequest, response: Publication }
      - { message: CancelPublicationRequest, response: Publication }
      - { message: ListPublicationsRequest, response: PublicationList }
      - { message: GetPublishedPageRequest, response: PublishedPage }
      - { message: ListPublishedPagesRequest, response: PublishedPageIndex }
      - { message: GetPreviewPageRequest, response: PublishedPage }
    sends:
      - { message: AuthorizeSiteAccessRequest, response: SiteAccess }
    api:
      service: ContentService
      methods:
        - { name: CreatePage, request: CreatePageRequest, response: CreatePageResponse }
        - { name: SavePage, request: SavePageRequest, response: SavePageResponse }
        - { name: MovePage, request: MovePageRequest, response: MovePageResponse }
        - { name: GetPage, request: GetPageRequest, response: GetPageResponse }
        - { name: ListPages, request: ListPagesRequest, response: ListPagesResponse }
        - { name: ListRevisions, request: ListRevisionsRequest, response: ListRevisionsResponse }
        - { name: PublishPage, request: PublishPageRequest, response: PublishPageResponse }
        - { name: UnpublishPage, request: UnpublishPageRequest, response: UnpublishPageResponse }
        - { name: SchedulePublication, request: SchedulePublicationRequest, response: SchedulePublicationResponse }
        - { name: ReschedulePublication, request: ReschedulePublicationRequest, response: ReschedulePublicationResponse }
        - { name: CancelPublication, request: CancelPublicationRequest, response: CancelPublicationResponse }
        - { name: ListPublications, request: ListPublicationsRequest, response: ListPublicationsResponse }

  - name: forms
    description: Owns contact-form submissions from visitors, their rate limits, and the editor inbox.
    owns:
      tables:
        - name: form_submission
          columns:
            - { name: id, type: uuid, primaryKey: true }
            - { name: site_id, type: uuid }
            - { name: page_path, type: string }
            - { name: name, type: string }
            - { name: email, type: string }
            - { name: message, type: string }
            - { name: ip_hash, type: string }
            - { name: read_at, type: timestamp, nullable: true }
            - { name: created_at, type: timestamp }
          indexes: [ { columns: [site_id, created_at] } ]
        - name: form_rate_limit
          columns:
            - { name: key, type: string, primaryKey: true }
            - { name: count, type: int32 }
            - { name: window_start, type: timestamp }
          indexes: [ { columns: [window_start] } ]
    schedules:
      - { name: purge_rate_limits, every: 1h }
    handles:
      - { message: SubmitContactFormRequest, response: FormSubmissionReceipt }
      - { message: ListFormSubmissionsRequest, response: FormSubmissionList }
      - { message: MarkFormSubmissionReadRequest, response: FormSubmission }
      - { message: DeleteFormSubmissionRequest, response: FormSubmission }
    sends:
      - { message: ResolvePublicSiteRequest, response: PublicSite }
      - { message: AuthorizeSiteAccessRequest, response: SiteAccess }
    api:
      service: FormsService
      methods:
        - { name: ListFormSubmissions, request: ListFormSubmissionsRequest, response: ListFormSubmissionsResponse }
        - { name: MarkFormSubmissionRead, request: MarkFormSubmissionReadRequest, response: MarkFormSubmissionReadResponse }
        - { name: DeleteFormSubmission, request: DeleteFormSubmissionRequest, response: DeleteFormSubmissionResponse }

  - name: delivery
    description: Renders public pages, blog index, sitemap and editor previews with the site theme; owns no state.
    handles:
      - { message: RenderPathRequest, response: RenderedDocument }
      - { message: PreviewPageRequest, response: RenderedDocument }
    sends:
      - { message: ResolvePublicSiteRequest, response: PublicSite }
      - { message: GetPublishedPageRequest, response: PublishedPage }
      - { message: ListPublishedPagesRequest, response: PublishedPageIndex }
      - { message: GetPreviewPageRequest, response: PublishedPage }
    api:
      service: PublicService
      methods:
        - { name: RenderPath, request: RenderPathRequest, response: RenderPathResponse }
        - { name: PreviewPage, request: PreviewPageRequest, response: PreviewPageResponse }
